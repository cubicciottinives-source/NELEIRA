<html lang="it">
<head>
<meta charset="UTF-8">

}

html{

========================= */

header{

}

.menu-contact:hover{

}


/* =========================

========================= */

  align-items:center;

  background:
    radial-gradient(

    ),
    linear-gradient(
      135deg,
      #f7f4ee 0%,
      #eee9e0 100%
    );
}

.hero::before{
  content:"";

  position:absolute;

  width:650px;
  height:650px;

  border:1px solid rgba(155,123,82,.16);
  border-radius:50%;

.hero::after{

  position:relative;
  z-index:2;
}

.eyebrow{

  align-items:center;
  gap:14px;

  color:var(--gold);

  font-size:10px;
  letter-spacing:4px;
  text-transform:uppercase;

  margin-bottom:28px;
}

.eyebrow::before{
  content:"";
  width:42px;
  height:1px;
  background:var(--gold);
}

.hero h1{

.hero-subtitle{

}

.button-light:hover{

  border-radius:50%;
}

.orbit::after{

  width:210px;
  height:210px;

  border:1px solid rgba(155,123,82,.28);

  border-radius:50%;
}

.orbit-line{
  position:absolute;

  width:520px;
  height:1px;

  background:rgba(155,123,82,.2);

}

.orbit-content{

.orbit-content strong{

.orbit-content span{

}

   COMMON
========================= */

.section{

.container{

}

.label{

  color:var(--gold);

}

.title{

}

}

.about-copy{

}

.statement{

}

   SERVICES
========================= */

}

.service-number{

}

}

.method .title{

.method .intro{

.steps{

  grid-template-columns:repeat(4,1fr);

  border-top:1px solid #444;
}

.step{
  padding:35px 28px 20px 0;

  margin-right:25px;

  border-right:1px solid #444;
}
