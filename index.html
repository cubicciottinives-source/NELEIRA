  <style>

    :root {
      --black: #080808;
      --black-soft: #111111;
      --black-card: #171717;

      --gold: #c9a45c;
      --gold-light: #e4c987;
      --gold-dark: #9d7938;

      --white: #ffffff;
      --white-soft: #f5f5f3;
      --gray: #b7b7b7;
      --gray-dark: #777777;

      --border: rgba(201,164,92,0.28);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    /* =========================
       HEADER
    ========================== */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;

      background: rgba(8,8,8,0.94);
      backdrop-filter: blur(14px);

      border-bottom: 1px solid rgba(201,164,92,0.18);
    }

    .nav {
      max-width: 1280px;
      height: 88px;
      margin: auto;
      padding: 0 35px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      letter-spacing: 8px;
      color: var(--white);
      font-weight: 400;
    }

    .logo small {
      display: block;
      margin-top: 3px;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 7px;
      letter-spacing: 3px;

      color: var(--gold);
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .menu a {
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #e7e7e7;

      transition: 0.3s ease;
    }

    .menu a:hover {
      color: var(--gold-light);
    }

    .menu-contact {
      border: 1px solid var(--gold);
      padding: 12px 19px;
      color: var(--gold-light) !important;
    }

    .menu-contact:hover {
      background: var(--gold);
      color: var(--black) !important;
    }

    /* =========================
       HERO
    ========================== */

    .hero {
      min-height: 100vh;
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(201,164,92,0.10),
          transparent 34%
        ),
        #080808;
    }

    .hero::before {
      content: "";
      position: absolute;

      width: 620px;
      height: 620px;

      border: 1px solid rgba(201,164,92,0.16);
      border-radius: 50%;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);
    }

    .hero::after {
      content: "";
      position: absolute;

      width: 470px;
      height: 470px;

      border: 1px solid rgba(201,164,92,0.11);
      border-radius: 50%;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);
    }

    .hero-content {
      position: relative;
      z-index: 2;

      text-align: center;

      max-width: 1000px;
      padding: 140px 25px 100px;
    }
